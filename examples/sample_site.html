<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Local Storefront · PerceptaHeal test page</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#14202b;font:16px/1.5 system-ui,sans-serif;padding:22px}.shell{max-width:900px;margin:0 auto}.hero{background:#e3f1ff;padding:22px;border-radius:18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.hero h1{font-size:28px;line-height:.95;height:27px;overflow:hidden;margin:0 0 12px}.hero p{max-width:520px}.actions{display:flex;align-items:center;gap:0;position:relative}.buy{height:34px;white-space:nowrap;padding:0 12px;border:0;border-radius:30px;background:#175fca;color:white}.badge{position:absolute;left:90px;top:4px;background:#d22;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #d8dee6;padding:17px;border-radius:12px}.card h2{font-size:18px;margin-top:0}@media(max-width:580px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="shell"><section class="hero"><div><h1>Discover your next everyday essential</h1><p>Explore thoughtfully selected products for work, home and travel.</p></div><div class="actions"><button class="buy">Explore collection</button><span class="badge">NEW OFFER</span></div></section><section class="cards"><article class="card"><h2>Work essentials</h2><p>Simple products for focused days.</p></article><article class="card"><h2>Home favourites</h2><p>Useful details for everyday living.</p></article><article class="card"><h2>Travel picks</h2><p>Compact items for the journey.</p></article></section></main></body>
</html>
